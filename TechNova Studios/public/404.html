<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - TechNova Studios</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                            800: '#1e293b',
                            700: '#334155',
                        },
                        cyan: {
                            400: '#22d3ee',
                            300: '#67e8f9',
                        },
                        blue: {
                            500: '#3b82f6',
                        },
                        gray: {
                            300: '#d1d5db',
                            400: '#9ca3af',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        .rotate-slow { animation: rotate 20s linear infinite; }
        .rotate-medium { animation: rotateReverse 15s linear infinite; }
        .rotate-fast { animation: rotate 10s linear infinite; }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        .slide-up { animation: slideUp 0.6s ease-out; }
        .scale-in { animation: scaleIn 0.6s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .button-hover { transition: all 0.3s ease; }
        .button-hover:hover { transform: scale(1.05); }
        .button-hover:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen bg-slate-950 py-12 md:py-20 lg:py-24">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center">
            <!-- Animated 404 Graphic -->
            <div class="mb-8 scale-in">
                <div class="relative mx-auto w-64 h-64 md:w-80 md:h-80">
                    <!-- Outer Circle -->
                    <div class="absolute inset-0 border-4 border-cyan-400/20 rounded-full rotate-slow"></div>
                    
                    <!-- Middle Circle -->
                    <div class="absolute inset-8 border-4 border-cyan-400/30 rounded-full rotate-medium"></div>
                    
                    <!-- Inner Circle -->
                    <div class="absolute inset-16 border-4 border-cyan-400/40 rounded-full rotate-fast"></div>
                    
                    <!-- Center Content -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="text-center fade-in" style="animation-delay: 0.3s;">
                            <h1 class="text-8xl md:text-9xl font-bold text-white mb-4">
                                404
                            </h1>
                            <div class="w-16 h-1 bg-gradient-to-r from-cyan-400 to-blue-500 mx-auto rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Message Section -->
            <div class="mb-8 slide-up" style="animation-delay: 0.4s;">
                <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4">
                    Page Not Found
                </h2>
                <p class="text-gray-300 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                    The page you're looking for doesn't exist or has been moved. 
                    Don't worry, we'll redirect you home shortly.
                </p>
            </div>

            <!-- Countdown Timer -->
            <div class="mb-8 slide-up" style="animation-delay: 0.6s;">
                <div class="inline-flex items-center gap-3 px-6 py-3 bg-slate-800/50 border border-slate-700 rounded-2xl">
                    <i data-lucide="clock" class="w-5 h-5 text-cyan-400"></i>
                    <span class="text-white font-medium">
                        Redirecting in <span id="countdown" class="text-cyan-400">10</span> seconds
                    </span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center slide-up" style="animation-delay: 0.8s;">
                <button 
                    onclick="goHome()"
                    class="px-8 py-4 bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-bold rounded-2xl hover:shadow-2xl transition-all duration-300 flex items-center gap-2 button-hover"
                >
                    <i data-lucide="home" class="w-5 h-5"></i>
                    Go Home Now
                </button>

                <button 
                    onclick="goBack()"
                    class="px-8 py-4 border-2 border-cyan-400 text-cyan-400 font-bold rounded-2xl hover:bg-cyan-400/10 transition-all duration-300 flex items-center gap-2 button-hover"
                >
                    <i data-lucide="arrow-right" class="w-5 h-5 rotate-180"></i>
                    Go Back
                </button>
            </div>

            <!-- Additional Help -->
            <div class="mt-12 fade-in" style="animation-delay: 1.0s;">
                <p class="text-gray-400 text-sm">
                    If you believe this is an error, please 
                    <a href="/contact" class="text-cyan-400 hover:text-cyan-300 underline transition-colors">
                        contact our support team
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        let countdown = 10;
        const countdownElement = document.getElementById('countdown');
        let countdownTimer;

        function startCountdown() {
            countdownTimer = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    goHome();
                }
            }, 1000);
        }

        function goHome() {
            clearInterval(countdownTimer);
            window.location.href = '/';
        }

        function goBack() {
            clearInterval(countdownTimer);
            window.history.back();
        }

        // Start countdown when page loads
        document.addEventListener('DOMContentLoaded', startCountdown);
    </script>
</body>
</html>
